name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            src/Tetris/Tetris.csproj
            tests/Tetris.Tests/Tetris.Tests.csproj

      - name: Restore
        run: dotnet restore Tetris.sln

      - name: Build
        run: dotnet build Tetris.sln -c Release --no-restore

      - name: Test
        run: dotnet test Tetris.sln -c Release --no-build

  lint:
    name: Lint (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: actionlint (workflow lint)
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error

      - name: EditorConfig check
        uses: editorconfig-checker/action-editorconfig-checker@v2
