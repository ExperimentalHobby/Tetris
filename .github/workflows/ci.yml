name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'LICENSE'
      - 'Tetris.code-workspace'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'LICENSE'
      - 'Tetris.code-workspace'
      - '.gitignore'

jobs:
  build-and-test:
    name: Build and Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            src/Tetris/Tetris.csproj
            tests/Tetris.Tests/Tetris.Tests.csproj

      - name: Restore
        run: dotnet restore Tetris.sln

      - name: Build
        run: dotnet build Tetris.sln -c Release --no-restore

      - name: Test
        run: dotnet test Tetris.sln -c Release --no-build

  lint:
    name: Lint (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secret scan)
        run: docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source=/repo -v

      - name: actionlint (workflow lint)
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error

      - name: EditorConfig check
        uses: editorconfig-checker/action-editorconfig-checker@v2
